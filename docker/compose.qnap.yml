# CodecTrans stack — QNAP Container Station (docker compose v5.1.1-qnap3)
#
# Deploy (QNAP):
#   /share/<your-data-volume>/.qpkg/container-station/bin/docker compose -f compose.yml up -d
#
# Notes:
# - Memory/CPU caps are deliberate (2026-10-26 incident, tightened 2026-10-27):
#   a runaway container must OOM-restart (restart policy brings it back,
#   in-flight jobs re-queue) instead of starving the host — a host-level
#   OOM killed dockerd (Exited 137) once. Idle usage is tiny (measured
#   server 15MB / node 37MB / redis 7MB); 2G covers worst-case health
#   decodes, 3.5G covers 2 concurrent 4K NVENC jobs, 512M the redis AOF.
# - Redis data (node registry AOF) persists in redis-data/ — safe to recreate.
# - The QEMU VM (Home Assistant) on this box is OUTSIDE this stack.
services:
  redis:
    image: redis:7-alpine
    container_name: codectrans-redis
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "--appendonly", "yes", "--port", "6380"]
    volumes:
      - /share/Container/codectrans/redis-data:/data
    mem_limit: 512m
    cpus: 1

  server:
    image: seokoa/codectrans-server:latest
    container_name: codectrans-server
    restart: unless-stopped
    network_mode: host
    # 2026-10-26: a disk-stall wedge parked all 4 tokio workers and the
    # listener went silent (process alive, no HTTP). A real-HTTP healthcheck
    # + restart policy self-heals any future wedge (re-registration re-queues
    # in-flight jobs — verified safe in the GPU-reboot incident).
    healthcheck:
      test: ["CMD", "curl", "-fs", "-m", "5", "http://127.0.0.1:8400/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      CT_REDIS: redis://127.0.0.1:6380
      CT_BASE: /data
      TZ: Asia/Seoul
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "all"
      CT_PORT: "8400"
      CT_FRONTEND: /opt/ct/frontend/dist
      CT_MAX_UPLOAD_MB: "16384"
    volumes:
      - /share/Container/codectrans/config:/data
      - /share/YourVolume1:/media/Volume1  # adjust to your share names
      - /share/YourVolume2:/media/Volume2  # adjust to your share names
      - /share/YourVolume3:/media/Volume3
    devices:
      - /dev/nvidia0
      - /dev/nvidiactl
      - /dev/nvidia-uvm
      - /dev/nvidia-uvm-tools
      # nvidia-caps: driver >=535 gates cuInit on these capability nodes —
      # without them cuInit fails (CUDA_ERROR_NOT_INITIALIZED) and the GPU
      # health decode + node NVENC silently fall back to CPU.
      - /dev/nvidia-caps/nvidia-cap1
      - /dev/nvidia-caps/nvidia-cap2
    mem_limit: 2g
    cpus: 4

  node:
    image: seokoa/codectrans-node:latest
    container_name: codectrans-node
    restart: unless-stopped
    network_mode: host
    environment:
      CT_NODE_NAME: qnap-3050-node
      CT_SERVER: http://127.0.0.1:8400
      CT_MAX_JOBS: "2"
      CT_WORKDIR: /opt/ct/work
      CT_BIND: "all"
      CT_PORT: "8401"
      TZ: Asia/Seoul
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "all"
    volumes:
      - /share/Container/codectrans/work:/opt/ct/work
      - /share/Container/codectrans/config/outputs:/data/outputs
      - /share/YourVolume1:/media/Volume1  # adjust to your share names
      - /share/YourVolume2:/media/Volume2  # adjust to your share names
      - /share/YourVolume3:/media/Volume3
    devices:
      - /dev/nvidia0
      - /dev/nvidiactl
      - /dev/nvidia-uvm
      - /dev/nvidia-uvm-tools
      - /dev/nvidia-caps/nvidia-cap1
      - /dev/nvidia-caps/nvidia-cap2
    mem_limit: 3.5g
    cpus: 4
