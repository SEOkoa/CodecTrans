version: '3.8'

# QNAP Container Station의 Applications 목록에서 보이는 이름
# (기본은 compose 파일이 있는 폴더명 — "compose"로 뜨는 원인).
# Compose spec의 top-level name: 프로젝트 이름 지정.
name: codec-trans

# CodecTrans (server + node + redis) — QNAP 3050 구성
#
#   docker compose -f qnap-compose.yml up -d
#   → http://<nas-ip>:8400
#
# GPU: QNAP의 패치된 docker 런타임이 NVIDIA_VISIBLE_DEVICES env로 트리거
# 되어 /dev/nvidia* 를 자동 주입한다 ( privileged/explicit devices 불필요 —
# 실행 중 컨테이너가 env-only로 GPU 쓰는 것을 확인함). 컨테이너 안의
# 드라이버 userland는 이미지가 번들한다 (/opt/nvidia-userland, 호스트
# 커널 드라이버 시리즈별 — 버전 불일치는 SYSTEM_DRIVER_MISMATCH).
#
#   - 노드: NVENC 인코딩 (hevc_nvenc/h264_nvenc)
#   - 서버: 스캔 헬스체크 GPU 디코드 (-hwaccel cuda) — 4K 디코드 = NVDEC,
#     서버 CPU가 스캔에 안 탄다
#
# 미디어는 서버와 노드 양쪽에 마운트한다 — 같은 파일시스템의 노드는 소스를
# 직접 읽고 결과를 config/outputs(=서버 /data/outputs)에 바로 스테이징
# (멀티 GB 루프백 업로드 없음).

services:
  # Redis (노드 레지스트리/설정 저장)
  codectrans-redis:
    container_name: codectrans-redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--port", "6380"]
    network_mode: host
    restart: unless-stopped
    volumes:
      # AOF 영속화 (기존 컨테이너의 anonymous volume에서 이관)
      - /share/Container/codectrans/redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # CodecTrans 서버 (웹 UI 8400 + 스케줄/카탈로그 + 스캔 헬스체크 GPU 디코드)
  codectrans-server:
    container_name: codectrans-server
    image: docker.io/seokoa/codectrans-server:latest
    network_mode: host
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
      - CT_PORT=8400
      - CT_REDIS=redis://127.0.0.1:6380
      - CT_BASE=/data
      - CT_FRONTEND=/opt/ct/frontend/dist
      # 노드에서 완성 파일을 업로드 받을 때 용량 한도 (MB)
      - CT_MAX_UPLOAD_MB=16384
      # GPU (스캔 헬스체크 디코드): QNAP 런타임이 이 env로 /dev/nvidia* 주입
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # ── API 인증 (LAN 노출 시 활성화): 서버/노드 양쪽에 같은 값 설정 ──
      # /api 전체에 Bearer 토큰 요구 (UI는 첫 401 시 토큰 입력 배너 표시)
      # - CT_API_TOKEN=변경할-비밀-토큰
    # GPU 장치 패스스루 (Tdarr 패턴 — QNAP에서 동작 확인).
    # cgroup 허용 모드(env-only)는 docker CLI/compose 생성 컨테이너에만 안
    # 걸리는지라 명시 디바이스로 확정.
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    volumes:
      # 카탈로그/라이브러리 설정/업로드 (QNAP 컨테이너 관례 폴더)
      - /share/Container/codectrans/config:/data
      # ── 미디어: 기존 Tdarr과 같은 3개 공유 폴더 ──────────────
      # (UI에서 /media/Volume1 형태로 폴더 등록)
      - /share/YourVolume1:/media/Volume1  # adjust to your share names
      - /share/YourVolume2:/media/Volume2  # adjust to your share names
      - /share/YourVolume3:/media/Volume3
      # ────────────────────────────────────────────────────────
    depends_on:
      codectrans-redis:
        condition: service_healthy

  # CodecTrans 노드 (RTX 3050 NVENC 인코딩)
  codectrans-node:
    container_name: codectrans-node
    image: docker.io/seokoa/codectrans-node:latest
    network_mode: host
    depends_on:
      - codectrans-server
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
      - CT_SERVER=http://127.0.0.1:8400
      - CT_NODE_NAME=qnap-3050-node
      - CT_PORT=8401
      - CT_BIND=all
      # 3050 NVENC 동시 인코딩 수
      - CT_MAX_JOBS=2
      # GPU: QNAP 런타임 트리거 (env-only — 실행 중 컨테이너와 동일)
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # 서버와 같은 값 (서버에 CT_API_TOKEN을 켜면)
      # - CT_API_TOKEN=change-me-strong-token
    # GPU 장치 패스스루 (Tdarr 패턴 — QNAP에서 동작 확인)
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    volumes:
      # 인코딩 중 스크래치 (임시 파일 — 완료 후 삭제)
      - /share/Container/codectrans/work:/opt/ct/work
      # 결과 = 서버의 /data/outputs와 같은 디렉터리 (로컬 스테이징, 업로드 불필요)
      - /share/Container/codectrans/config/outputs:/data/outputs
      # 같은 파일시스템 소스 직접 읽기 (멀티 GB 루프백 회피)
      - /share/YourVolume1:/media/Volume1  # adjust to your share names
      - /share/YourVolume2:/media/Volume2  # adjust to your share names
      - /share/YourVolume3:/media/Volume3
